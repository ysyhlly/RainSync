<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑单车</title>
  <desc id="desc">一只戴红色围巾的白鹈鹕骑着绿色单车，沿海岸轻快前行。车轮旋转，双脚踩动踏板，围巾随风飘动。</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#dff3f1"/><stop offset="1" stop-color="#fff9e9"/></linearGradient>
    <linearGradient id="beak" x2="0" y2="1"><stop stop-color="#ffd066"/><stop offset="1" stop-color="#efa346"/></linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".65" fill="#355a58" opacity=".06"/></pattern>
    <g id="wheel" fill="none">
      <circle r="91" stroke="#233f47" stroke-width="13"/>
      <circle r="81" stroke="#fff9e9" stroke-width="4"/>
      <g stroke="#70979a" stroke-width="2.2">
        <path d="M-78 0H78M0-78V78M-55-55 55 55M-55 55 55-55M-72-30 72 30M-30-72 30 72M-72 30 72-30M-30 72 30-72"/>
      </g>
      <circle r="10" fill="#f6b84f" stroke="#233f47" stroke-width="4"/>
    </g>
    <style>
      .line { stroke:#233f47; stroke-linecap:round; stroke-linejoin:round; }
      .bob { animation:bob 1s ease-in-out infinite; }
      .scarf { animation:flap .65s ease-in-out infinite alternate; transform-origin:580px 269px; }
      @keyframes bob { 0%,100% { transform:translateY(0) rotate(-.3deg); } 50% { transform:translateY(-5px) rotate(.3deg); } }
      @keyframes flap { from { transform:rotate(-5deg); } to { transform:rotate(6deg); } }
      @media (prefers-reduced-motion:reduce) { .bob,.scarf { animation:none; } }
    </style>
  </defs>

  <rect width="1000" height="700" rx="30" fill="url(#sky)"/>
  <circle cx="787" cy="145" r="61" fill="#ffd87c"/>
  <g fill="#fffefa" opacity=".85">
    <path d="M98 157c-2-21 25-31 39-18 8-34 58-35 68 0 28-12 43 10 37 22H98Z"/>
    <path d="M580 112c1-18 21-25 35-15 10-28 46-24 54 2 20-8 35 5 34 15H580Z"/>
  </g>
  <path d="M0 419Q170 388 339 424T685 419T1000 412V565H0Z" fill="#95c9c5" opacity=".5"/>
  <path d="M0 469Q170 435 348 472T712 466T1000 455V563H0Z" fill="#72b5b5" opacity=".4"/>
  <path d="M0 529Q252 502 508 526T1000 522V700H0Z" fill="#f0dfbb"/>
  <path d="M0 563H1000" stroke="#c6b797" stroke-width="3"/>
  <g stroke="#d5c29d" stroke-width="4" stroke-linecap="round">
    <path d="M-150 606h60m100 0h24m110 0h65m100 0h24m110 0h65m100 0h24m110 0h65m100 0h24m110 0h65m100 0h24">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-334 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <ellipse cx="509" cy="565" rx="269" ry="17" fill="#526759" opacity=".12"/>

  <!-- Turning wheels and the sea-green bicycle. -->
  <g transform="translate(342 466)"><use href="#wheel"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/></use></g>
  <g transform="translate(692 466)"><use href="#wheel"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/></use></g>
  <g class="line" fill="none">
    <path d="M342 466 422 342 498 466 342 466 613 360 498 466M613 360 692 466M613 360 598 319" stroke="#233f47" stroke-width="15"/>
    <path d="M342 466 422 342 498 466 342 466 613 360 498 466M613 360 692 466M613 360 598 319" stroke="#379b8e" stroke-width="9"/>
    <path d="m422 342-12-32M598 319l-8-25q-5-15 11-16h39" stroke-width="8"/>
    <path d="M628 278h23" stroke="#a96648" stroke-width="12"/>
    <path d="M380 309q26-11 56 0" stroke-width="15"/>
    <path d="M269 438q32-78 105-55M638 391q68-40 126 23" stroke="#e2a64f" stroke-width="7"/>
    <path d="M347 466 489 449q30-6 31 18t-29 19L347 475Z" stroke-width="3" opacity=".7"/>
  </g>
  <circle cx="498" cy="466" r="24" fill="#f7e9c9" stroke="#233f47" stroke-width="5"/>

  <!-- Far leg: its ankle follows the rear pedal around the crank. -->
  <path class="line" d="M452 340Q454 392 461 415L468 466" fill="none" stroke="#d89538" stroke-width="11">
    <animate attributeName="d" dur="1s" repeatCount="indefinite" values="M452 340Q454 392 461 415L468 466;M452 340Q474 375 491 397L498 436;M452 340Q509 386 519 420L528 466;M452 340Q457 407 479 442L498 496;M452 340Q454 392 461 415L468 466"/>
  </path>
  <g transform="translate(498 466)">
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <path d="M-30 0H30" stroke="#233f47" stroke-width="6"/>
      <g transform="translate(-30 0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1s" repeatCount="indefinite"/><path d="M-12 5h24" stroke="#233f47" stroke-width="6" stroke-linecap="round"/></g></g>
      <g transform="translate(30 0)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1s" repeatCount="indefinite"/><path d="M-12 7h29" stroke="#233f47" stroke-width="6" stroke-linecap="round"/><path d="M-5-7 19 0q10 6 0 7H-9Z" fill="#f5b442" stroke="#233f47" stroke-width="3"/></g></g>
    </g>
  </g>
  <path class="line" d="M467 337Q512 382 520 417L528 466" fill="none" stroke="#f5b442" stroke-width="13">
    <animate attributeName="d" dur="1s" repeatCount="indefinite" values="M467 337Q512 382 520 417L528 466;M467 337Q462 407 480 443L498 496;M467 337Q443 388 454 415L468 466;M467 337Q484 368 492 399L498 436;M467 337Q512 382 520 417L528 466"/>
  </path>

  <g class="bob">
    <!-- Tail, round belly, and the tall curved pelican neck. -->
    <path class="line" d="m381 291-57-26 24 42-26-7q30 38 74 35" fill="#fbfcf4" stroke-width="4"/>
    <path class="line" d="M365 276q31-39 102-24 34 2 45-25 12-27 11-55-1-46 40-49 44-3 51 32 5 22-10 44-18 27-11 69 8 44-31 68-32 22-97 17-79-3-100-39-11-19 0-38Z" fill="#fffdf3" stroke-width="4"/>
    <path d="M376 315q57 35 128 12 53-15 61-66-6 55-37 74-44 29-109 14-28-6-43-34Z" fill="#dce8de"/>
    <path class="line" d="M403 276q45-14 80 14 17 11 37 9-23 35-61 24-29-7-48-27m16 4q29 17 50 13" fill="#edf2e7" stroke-width="3.5"/>
    <!-- A wing reaches forward to hold the handlebar. -->
    <path class="line" d="M497 268q37 26 70 17l54-13q17-3 18 6 0 8-14 10l-53 16q-35 11-59-3" fill="#fffdf3" stroke-width="4"/>
    <path class="line" d="m620 280 10-1m-15 7 12-2" fill="none" stroke-width="2"/>
    <!-- Long bill and unmistakable elastic throat pouch. -->
    <path class="line" d="M598 173 763 181q-36 66-108 68-42 0-57-55Z" fill="url(#beak)" stroke-width="4"/>
    <path d="M610 191q47 43 126 6-39 42-83 42-30-1-43-48Z" fill="#edb35f"/>
    <path class="line" d="M599 171q71-4 165 7 12 2 6 9l-167 3" fill="#ffd573" stroke-width="4"/>
    <path d="M602 168q-10-20-32-10" fill="none" stroke="#fffdf3" stroke-width="10"/>
    <ellipse cx="579" cy="161" rx="6" ry="8" fill="#233f47"/>
    <circle cx="581" cy="158" r="2" fill="white"/>
    <path class="line" d="m568 143 13-3" fill="none" stroke-width="3"/>
    <ellipse cx="590" cy="185" rx="10" ry="6" fill="#f1b9a0" opacity=".75"/>
    <path class="line" d="m545 127-7-17m16 13 1-19m8 19 8-14" fill="none" stroke-width="3"/>
    <g class="scarf">
      <path class="line" d="M574 262q-42-13-79-7-31 6-59-7l16 17-21 10q31 17 65 1 35-13 78 1" fill="#e46e55" stroke-width="3"/>
      <path d="m446 259 7 7-9 7m21-15 3 17" fill="none" stroke="#ffb392" stroke-width="4"/>
    </g>
    <path class="line" d="M542 254q20 14 42 2l4 16q-25 15-49-2Z" fill="#e46e55" stroke-width="3"/>
    <circle cx="575" cy="267" r="10" fill="#f28364" stroke="#233f47" stroke-width="3"/>
  </g>

  <g class="line" fill="none" stroke="#668f91" stroke-width="3" opacity=".65">
    <path d="M240 281h61m-82 19h51m-18 20h34">
      <animate attributeName="opacity" values=".3;.9;.3" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M818 314q8-10 16 0 8-10 16 0M121 363q7-9 14 0 7-9 14 0"/>
  </g>
  <rect width="1000" height="700" rx="30" fill="url(#grain)" pointer-events="none"/>
  <text x="500" y="651" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="21" letter-spacing="4" fill="#477575">a little ride by the sea</text>
</svg>
