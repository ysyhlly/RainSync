<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>旷野 · 石油磕头机</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1419;--panel:#101e25;--ink:#e6eceb;--muted:#8b9da3;--accent:#f4b45e;--line:#273b44}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;padding:44px 5vw 28px}
    main{max-width:1400px;margin:auto}header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:14px}h1{font-size:clamp(27px,4vw,44px);font-weight:500;letter-spacing:3px;margin:0}header p{color:var(--muted);font-size:13px;line-height:1.8;margin:12px 0 0}.edition{font-size:11px;letter-spacing:2px;color:var(--muted);text-align:right;line-height:2;white-space:nowrap}
    .scene{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}.scene-top{display:flex;justify-content:space-between;align-items:center;position:absolute;top:22px;left:26px;right:26px;gap:12px;pointer-events:none;font-size:11px;letter-spacing:2px;color:var(--muted)}.live{display:flex;align-items:center;gap:9px;color:#bdd4cd}.dot{width:6px;height:6px;border-radius:50%;background:#9ed0ba;box-shadow:0 0 12px #9ed0ba66}.paused .dot{background:var(--accent);box-shadow:none}svg{display:block;width:100%;height:auto}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:20px 26px;border-top:1px solid var(--line);background:#0e1b21}.playback{display:flex;align-items:center;gap:24px;flex-wrap:wrap}button{border:1px solid #52636a;border-radius:8px;padding:10px 19px;background:#1d3039;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;min-width:108px}button:hover{background:#2a404b}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.speed{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}input{width:120px;accent-color:var(--accent)}output{color:var(--ink);min-width:35px;font-variant-numeric:tabular-nums}.readout{display:flex;align-items:center;gap:26px;font-size:11px;color:var(--muted)}.readout strong{display:block;color:var(--ink);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums;margin-top:5px}.readout strong span{font-size:10px;color:var(--muted);margin-left:4px}
    footer{display:flex;justify-content:space-between;gap:22px;color:var(--muted);font-size:11px;line-height:1.9;margin-top:20px}.legend{display:flex;align-items:center;gap:8px;white-space:nowrap}.legend i{display:inline-block;width:18px;height:3px;background:var(--accent)}.label{font-size:13px;fill:#b4c4c8;letter-spacing:2px}.small-label{font-size:10px;fill:#637d87;letter-spacing:2px}.leader{fill:none;stroke:#58727d;stroke-width:1;stroke-dasharray:3 5}.bolt{fill:#14232b;stroke:#9cacb0;stroke-width:3}
    @media(max-width:650px){body{padding:26px 16px}.edition{display:none}header{margin-bottom:22px}.scene-top{top:15px;left:16px;right:16px;font-size:9px;letter-spacing:1px}.controls{padding:18px 16px;gap:20px}.playback{gap:16px}input{width:95px}.readout{width:100%;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}.readout strong{font-size:15px}footer{flex-direction:column;gap:6px}.scene svg{min-height:290px}}
  </style>
</head>
<body>
<main>
  <header>
    <div><div class="eyebrow">FIELD NOTES / MECHANICAL MOTION</div><h1>旷野里的节拍</h1><p>石油磕头机 · 游梁式抽油机的往复运动</p></div>
    <div class="edition">KINETIC STUDY — 01<br>二维机械 · SVG 动画</div>
  </header>
  <section class="scene" aria-label="石油磕头机动画及控制">
    <div class="scene-top"><span class="live"><i class="dot"></i><span id="status" role="status">机构运行中</span></span><span>陆上油田 / 侧视图</span></div>
    <svg viewBox="0 0 1200 680" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">石油磕头机的二维联动动画</title>
      <desc id="scene-desc">电动机带动曲柄旋转，曲柄通过连杆驱动游梁摆动，右侧驴头带动悬绳和光杆上下往复。下方可以暂停和调节速度。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#142630"/><stop offset="1" stop-color="#101b21"/></linearGradient>
        <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#6c858f"/><stop offset=".45" stop-color="#425d69"/><stop offset="1" stop-color="#263c47"/></linearGradient>
        <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffce86"/><stop offset="1" stop-color="#c67e32"/></linearGradient>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7093a0" stroke-opacity=".055"/></pattern>
        <pattern id="soil" width="24" height="16" patternUnits="userSpaceOnUse"><path d="M2 11h4m11-7h2" stroke="#38505b" stroke-width="1"/></pattern>
        <filter id="glow"><feGaussianBlur stdDeviation="25"/></filter>
      </defs>
      <path fill="url(#sky)" d="M0 0h1200v680H0z"/>
      <circle cx="920" cy="180" r="95" fill="#efab51" opacity=".025" filter="url(#glow)"/>
      <path fill="url(#grid)" d="M0 0h1200v580H0z"/>
      <g fill="none" stroke="#55717e" opacity=".15"><path d="M0 471 92 441 168 459 245 419 340 457 448 436 555 470 677 450 774 471 917 429 1067 450 1152 421 1200 444"/><path d="M0 505 150 484 304 501 440 479 646 503 780 492 1000 476 1200 494"/></g>
      <g opacity=".16" stroke="#6c838a" fill="none" stroke-width="4"><path d="m1070 528 20-85 20 85m-34-27h28m-37-63 75 9m-55-5-30 57m-6 23 6-23 22 3m38-57v74"/><circle cx="1050" cy="513" r="12"/></g>
      <path d="M0 580H1200V680H0Z" fill="#0b161c"/><path d="M0 589H1200V680H0Z" fill="url(#soil)" opacity=".5"/><path d="M0 580H1200" stroke="#49606a"/>
      <ellipse cx="575" cy="570" rx="375" ry="12" fill="#050c10" opacity=".65"/>
      <!-- 混凝土基础、底座和固定支架 -->
      <path d="M189 559h553v22H189Z" fill="#536169"/><path d="M189 574h553v7H189Z" fill="#313f47"/>
      <rect x="212" y="541" width="507" height="18" rx="3" fill="#344d59" stroke="#6d838d"/>
      <g fill="url(#metal)" stroke="#75909c" stroke-width="1.5"><path d="m493 539 85-274h26l-67 274Z"/><path d="m603 265 96 274h-43l-67-274Z"/></g>
      <g stroke="#657f8b" stroke-width="9" fill="none"><path d="m540 415 111 86m-118 0 97-87M554 363h72M525 501h141"/></g>
      <path d="M561 272v-27h68v27Z" fill="#2b4552" stroke="#78929b" stroke-width="2"/>
      <!-- 减速箱、电动机和皮带 -->
      <path d="M299 538V471l23-39h67l28 43v63Z" fill="#29424f" stroke="#75909b" stroke-width="2"/>
      <rect x="220" y="493" width="68" height="43" rx="7" fill="#46616d" stroke="#79909a"/>
      <g stroke="#1f3540" stroke-width="3"><path d="M230 499v31m9-31v31m9-31v31m9-31v31m9-31v31"/></g>
      <path d="M274 499 342 453M275 528 360 482" stroke="#0a1319" stroke-width="7"/>
      <circle cx="278" cy="514" r="16" fill="#223a46" stroke="#81939a" stroke-width="2"/>
      <g id="motor-wheel" stroke="#b8c5c7" stroke-width="2"><path d="M267 514h22m-11-11v22"/></g>
      <!-- 曲柄围绕减速箱轴旋转；配重位于曲柄销的另一侧 -->
      <circle cx="355" cy="460" r="67" fill="none" stroke="#627985" stroke-dasharray="3 8" opacity=".35"/>
      <g id="crank">
        <path d="M-20-18H55a18 18 0 0 1 0 36H-20Z" fill="url(#amber)" stroke="#ffd393" stroke-width="2"/>
        <path d="M-27-62A68 68 0 0 0-27 62L-12 29A32 32 0 0 1-12-29Z" fill="#a7743e" stroke="#e2ad6a" stroke-width="2"/>
        <path d="M-32-48A58 58 0 0 0-32 48" fill="none" stroke="#e7b573" stroke-width="2" opacity=".45"/>
      </g>
      <circle cx="355" cy="460" r="12" class="bolt"/><circle cx="355" cy="460" r="4" fill="#d1dadd"/>
      <line id="rod-shadow" stroke="#081319" stroke-width="20" stroke-linecap="round"/>
      <line id="connecting-rod" stroke="#a0b3bb" stroke-width="12" stroke-linecap="round"/>
      <line id="rod-highlight" stroke="#d4dedf" stroke-width="2" opacity=".65"/>
      <!-- 游梁与驴头属于同一个刚体 -->
      <g id="beam">
        <path d="M-224-15 261-21 280-10V11L261 21-224 15Z" fill="url(#amber)" stroke="#ffce86" stroke-width="2"/>
        <path d="M-218 0H265" stroke="#99632c" stroke-width="3"/>
        <path d="M-204-11v22M-145-12v24M-84-14v28M80-16v32M150-17v34M220-18v36" stroke="#a36b32" stroke-width="3"/>
        <path d="M260-109 285.487-133.125A315 315 0 0 1 285.487 133.125L260 109Q284 0 260-109Z" fill="url(#amber)" stroke="#ffce86" stroke-width="2"/>
        <path d="M275-101Q299 0 275 101" fill="none" stroke="#9c642d" stroke-width="3"/>
        <path d="m266-15 40-5m-40 35 40 5" stroke="#9c642d" stroke-width="3"/>
        <circle cx="-205" cy="0" r="12" class="bolt"/><circle cx="-205" cy="0" r="4" fill="#d3dee0"/>
      </g>
      <circle cx="595" cy="260" r="23" fill="#253e4a" stroke="#91a6af" stroke-width="3"/><circle cx="595" cy="260" r="11" fill="#b7c5c9"/><circle cx="595" cy="260" r="4" fill="#425d69"/>
      <circle id="crank-pin" r="9" class="bolt"/>
      <!-- 悬绳沿驴头圆弧相切，切线位置固定；光杆只作竖直运动 -->
      <path id="cable" fill="none" stroke="#e1e6df" stroke-width="2.5"/>
      <g id="polished-rod"><path d="M910 0V580" stroke="#b9d0d5" stroke-width="5"/><path d="M910 0V580" stroke="#e8f2ed" stroke-width="1"/><rect x="897" y="-5" width="26" height="10" rx="2" fill="#d4c09b" stroke="#ffce86"/></g>
      <!-- 井口与地下抽油杆 -->
      <path d="M895 680V558h30v122" fill="#172e3a" stroke="#647d88" stroke-width="2"/>
      <path d="M910 592V680" stroke="#be9d70" stroke-width="3" stroke-dasharray="9 5"/>
      <rect x="882" y="569" width="56" height="11" rx="2" fill="#486570" stroke="#8399a1"/>
      <rect x="898" y="539" width="24" height="31" rx="3" fill="#496976" stroke="#a1b4ba"/>
      <path d="M923 551h64v20h78" fill="none" stroke="#607d89" stroke-width="10"/><path d="M923 548h67" fill="none" stroke="#9fb3bc" stroke-width="2"/>
      <path d="M957 535v18" stroke="#a4b8bd" stroke-width="4"/><ellipse cx="957" cy="531" rx="13" ry="4" fill="none" stroke="#d8ac6a" stroke-width="3"/>
      <g><path class="leader" d="M665 122v45l-16 47"/><text class="label" x="644" y="110">游梁</text><path class="leader" d="M983 192h-45l-27 25"/><text class="label" x="994" y="197">驴头</text><path class="leader" d="M1007 371h-53l-32 30"/><text class="label" x="1015" y="375">悬绳 · 光杆</text><path class="leader" d="M170 376h90l41 47"/><text class="label" x="110" y="380">曲柄</text><path class="leader" d="M156 468h51l24 28"/><text class="label" x="94" y="472">电动机</text></g>
      <text class="small-label" x="190" y="615">SURFACE / 地面</text><text class="small-label" x="947" y="637">通向井下抽油泵 ↓</text>
      <g fill="none" stroke="#5e7884" stroke-width="1" opacity=".6"><path d="M45 80v20m-10-10h20M1155 80v20m-10-10h20M45 630v20m-10-10h20M1155 630v20m-10-10h20"/></g>
    </svg>
    <div class="controls">
      <div class="playback"><button id="toggle" type="button" aria-label="暂停动画">Ⅱ 暂停</button><label class="speed" for="speed">运行速度 <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><output id="speed-value" for="speed">1×</output></label></div>
      <div class="readout"><div>曲柄转角<strong id="angle">0<span>°</span></strong></div><div>循环频率<strong id="frequency">10<span>次 / 分</span></strong></div><div>动力传递<strong style="font-size:12px;line-height:21px">旋转 → 摆动 → 往复</strong></div></div>
    </div>
  </section>
  <footer><span>曲柄牵动连杆，游梁绕支点摆动；驴头带动抽油杆，在一次次起落中将原油举升。</span><span class="legend"><i></i> 运动部件 <span style="margin-left:10px;color:#536d79">01 / SVG STUDY</span></span></footer>
</main>
<script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const beam = $('beam'), crank = $('crank'), pin = $('crank-pin');
    const rods = [$('rod-shadow'), $('connecting-rod'), $('rod-highlight')];
    const toggle = $('toggle'), speed = $('speed'), scene = document.querySelector('.scene');
    const tau = Math.PI * 2, pivot = {x:595,y:260}, axle = {x:355,y:460};
    const beamRear = 205, rodLength = 185, crankRadius = 55, headRadius = 315;
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let phase = 0, running = !reducedMotion.matches, lastTime = null, frame = null;

    function draw() {
      const c = {x:axle.x + crankRadius*Math.cos(phase), y:axle.y + crankRadius*Math.sin(phase)};
      // 两圆交点求连杆上端：游梁后臂和连杆的长度在整周运动中保持不变。
      const dx=c.x-pivot.x, dy=c.y-pivot.y, distance=Math.hypot(dx,dy);
      const along=(beamRear**2-rodLength**2+distance**2)/(2*distance);
      const height=Math.sqrt(Math.max(0,beamRear**2-along**2));
      const b={x:pivot.x+along*dx/distance-height*dy/distance,
               y:pivot.y+along*dy/distance+height*dx/distance};
      const tilt=Math.atan2(pivot.y-b.y,pivot.x-b.x);
      const degrees=tilt*180/Math.PI;
      beam.setAttribute('transform',`translate(${pivot.x} ${pivot.y}) rotate(${degrees})`);
      crank.setAttribute('transform',`translate(${axle.x} ${axle.y}) rotate(${phase*180/Math.PI})`);
      $('motor-wheel').setAttribute('transform',`rotate(${phase*180/Math.PI*4} 278 514)`);
      rods.forEach(rod=>{rod.setAttribute('x1',c.x);rod.setAttribute('y1',c.y);rod.setAttribute('x2',b.x);rod.setAttribute('y2',b.y);});
      pin.setAttribute('cx',c.x);pin.setAttribute('cy',c.y);
      const rodTop=435+headRadius*tilt;
      const startAngle=tilt-25*Math.PI/180;
      const startX=pivot.x+headRadius*Math.cos(startAngle), startY=pivot.y+headRadius*Math.sin(startAngle);
      $('cable').setAttribute('d',`M${startX} ${startY} A${headRadius} ${headRadius} 0 0 1 910 260 V${rodTop}`);
      // 光杆上端随悬绳移动，下端始终穿过井口。
      const polished=$('polished-rod');
      polished.querySelectorAll('path').forEach(path=>path.setAttribute('d',`M910 ${rodTop}V580`));
      polished.querySelector('rect').setAttribute('y',rodTop-5);
      $('angle').innerHTML=`${Math.floor(phase/tau*360)}<span>°</span>`;
    }
    function animate(time) {
      if(!running || document.hidden){frame=null;lastTime=null;return;}
      if(lastTime!==null) phase=(phase+Math.min((time-lastTime)/1000,.1)*tau/6*Number(speed.value))%tau;
      lastTime=time;draw();frame=requestAnimationFrame(animate);
    }
    function updatePlayback() {
      toggle.textContent=running?'Ⅱ 暂停':'▶ 播放';
      toggle.setAttribute('aria-label',running?'暂停动画':'播放动画');
      $('status').textContent=running?'机构运行中':'动画已暂停';
      scene.classList.toggle('paused',!running);
      if(frame!==null)cancelAnimationFrame(frame);
      frame=null;lastTime=null;
      if(running&&!document.hidden)frame=requestAnimationFrame(animate);
    }
    toggle.addEventListener('click',()=>{running=!running;updatePlayback();});
    speed.addEventListener('input',()=>{
      $('speed-value').textContent=`${Number(speed.value)}×`;
      $('frequency').innerHTML=`${Number(speed.value)*10}<span>次 / 分</span>`;
    });
    document.addEventListener('visibilitychange',updatePlayback);
    reducedMotion.addEventListener('change',event=>{if(event.matches){running=false;updatePlayback();}});
    draw();updatePlayback();
  })();
</script>
</body>
</html>
