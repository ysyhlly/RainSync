[workspace]
members = ["apps/server", "apps/media-worker", "apps/nas-agent", "crates/protocol", "crates/room-core", "crates/media-core", "crates/providers", "crates/persistence", "crates/http-api"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
# Persisted room snapshots and command replays must retain exact f64 values.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
protocol = { path = "crates/protocol" }
room-core = { path = "crates/room-core" }
media-core = { path = "crates/media-core" }
providers = { path = "crates/providers" }
persistence = { path = "crates/persistence" }
http-api = { path = "crates/http-api" }
