[package]
name = "media-core"
version.workspace = true
edition.workspace = true
[dependencies]
anyhow.workspace = true
axum.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2 = "0.10"
url = "2"
http = "1"
ipnet = "2"
protocol.workspace = true

[features]
# Test-only: default the confinement root to the system temp dir when
# MEDIA_ROOT is unset. Enabled only via dependents' dev-dependencies.
test-media-root = []

[dev-dependencies]
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Storage_FileSystem"] }
