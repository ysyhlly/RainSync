<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旷野 · 石油磕头机</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #111b20; color: #eee7d8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 36px; background: radial-gradient(ellipse at 50% 0%, #2e3d40, #111b20 70%); }
    main { width: min(1120px, 100%); }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    .eyebrow { font-size: 11px; letter-spacing: .24em; color: #d7a36d; margin: 0 0 12px; }
    h1 { font-size: clamp(25px, 4vw, 40px); font-weight: 500; letter-spacing: .12em; margin: 0; }
    .subtitle { font-size: 12px; color: #93a3a6; letter-spacing: .12em; }
    .scene { overflow: hidden; position: relative; border: 1px solid #68716b55; border-radius: 18px; background: #dbc0a0; box-shadow: 0 30px 80px #0005; }
    svg { display: block; width: 100%; height: auto; }
    .scene-tag { position: absolute; left: 28px; top: 25px; color: #4e5654; font: 11px monospace; letter-spacing: .14em; }
    .scene-tag span { display: inline-block; width: 6px; height: 6px; margin-right: 8px; background: #bd673b; border-radius: 50%; }
    .controls { display: flex; align-items: center; gap: 24px; padding: 22px 2px; flex-wrap: wrap; }
    button { border: 1px solid #647375; background: #243438; color: #eee7d8; font: inherit; font-size: 13px; padding: 11px 20px; border-radius: 8px; cursor: pointer; min-width: 116px; }
    button:hover { background: #36484b; }
    button:focus-visible, input:focus-visible { outline: 2px solid #efb472; outline-offset: 5px; }
    label { display: flex; align-items: center; gap: 13px; color: #aab6b6; font-size: 12px; }
    input { width: 135px; accent-color: #d69a60; cursor: pointer; }
    output { color: #e5b584; font: 12px monospace; min-width: 34px; }
    .status { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 12px; color: #abb9b8; }
    .status i { width: 7px; height: 7px; background: #a4bb9e; border-radius: 50%; }
    footer { border-top: 1px solid #ffffff13; padding-top: 17px; display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: #829394; letter-spacing: .06em; }
    @media (max-width: 600px) { body { padding: 22px 14px; } header { align-items: start; } .subtitle { max-width: 95px; line-height: 1.8; text-align: right; } .scene-tag { top: 15px; left: 17px; font-size: 9px; } .controls { gap: 17px; } .status { margin-left: 0; } footer { line-height: 1.7; } }
  </style>
</head>
<body>
<main>
  <header>
    <div><p class="eyebrow">KINETIC STUDY / 001</p><h1>旷野里的节律</h1></div>
    <div class="subtitle">游梁式抽油机<br>SVG · 二维机械动画</div>
  </header>
  <section class="scene" aria-label="夕阳下持续运转的石油磕头机">
    <div class="scene-tag"><span></span>OIL FIELD / SUNSET</div>
    <svg viewBox="0 0 1100 650" role="img" aria-labelledby="sceneTitle sceneDesc">
      <title id="sceneTitle">石油磕头机联动动画</title>
      <desc id="sceneDesc">沙漠夕阳中，曲柄和配重旋转，连杆驱动游梁与驴头上下摆动，带动抽油杆往复运动。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b6c0b7"/><stop offset=".65" stop-color="#e4c7a0"/><stop offset="1" stop-color="#e9ac79"/></linearGradient>
        <linearGradient id="sand" x2="0" y2="1"><stop stop-color="#b58d69"/><stop offset="1" stop-color="#6c6758"/></linearGradient>
        <linearGradient id="steel" x2="0.8" y2="1"><stop stop-color="#486367"/><stop offset="1" stop-color="#233a40"/></linearGradient>
        <linearGradient id="rust" x2="0" y2="1"><stop stop-color="#dc9860"/><stop offset="1" stop-color="#ad5b3a"/></linearGradient>
        <radialGradient id="glow"><stop stop-color="#ffe1a3" stop-opacity=".5"/><stop offset="1" stop-color="#ffe1a3" stop-opacity="0"/></radialGradient>
        <pattern id="grit" width="57" height="31" patternUnits="userSpaceOnUse"><path d="M4 13h4m25 12h7m8-22h2" stroke="#e4c69d" stroke-opacity=".15"/></pattern>
      </defs>
      <rect width="1100" height="650" fill="url(#sky)"/>
      <circle cx="837" cy="204" r="180" fill="url(#glow)"/>
      <circle cx="837" cy="204" r="65" fill="#fbe0ab" opacity=".9"/>
      <path d="M0 375 90 338 160 356 256 311 341 351 423 332 538 367 620 343 718 373 830 322 927 340 1020 312 1100 349V550H0Z" fill="#9a9c8b" opacity=".44"/>
      <path d="M0 409Q180 371 335 403T650 411T1100 389V650H0Z" fill="url(#sand)"/>
      <path d="M0 469Q250 425 532 469T1100 451" fill="none" stroke="#d4ad83" stroke-opacity=".45" stroke-width="3"/>
      <rect y="420" width="1100" height="230" fill="url(#grit)"/>
      <!-- Distant field silhouettes. -->
      <g fill="#626d65" stroke="#626d65" opacity=".34">
        <path d="m935 407 19-78 20 78h-7l-13-56-12 56Zm-44-86 104 16-2 7-104-16Z"/>
        <path d="m891 320-7 2-3 28 11 2Z"/>
        <path d="M886 349v65m97-72 9 42m-6 10h21" fill="none" stroke-width="3"/>
        <circle cx="996" cy="392" r="12" stroke-width="3" fill="none"/>
        <path d="m82 405 13-52 13 52h-5l-8-36-9 36Zm-21-58 62 5v5l-63-5Z"/>
        <path d="M61 348v58m54-50 7 37" fill="none" stroke-width="2"/>
      </g>
      <ellipse cx="522" cy="551" rx="310" ry="24" fill="#34413b" opacity=".19"/>
      <!-- Foundation and fixed A-frame. -->
      <path d="M355 518h443l25 22H337Z" fill="#afa58b"/>
      <path d="M337 540h486v16H337Z" fill="#716f61"/>
      <rect x="360" y="512" width="418" height="14" rx="3" fill="#293f42"/>
      <path d="m402 511 85-257h25l86 257h-25l-74-219-71 219Z" fill="url(#steel)" stroke="#243b40" stroke-width="3"/>
      <path d="m430 445 127-84m-108 24 126 93m-140-50h131" fill="none" stroke="#3a5559" stroke-width="11"/>
      <path d="m406 510 84-247m26 21 74 232" stroke="#799087" stroke-opacity=".4" stroke-width="3"/>
      <path d="M475 256v-17h50v17" fill="#273f44"/>
      <!-- Gearbox, motor, and belt. -->
      <path d="M635 511v-97q0-47 45-47t45 47v97Z" fill="url(#steel)" stroke="#253b3e" stroke-width="4"/>
      <path d="M647 498h65m-65-9h65" stroke="#789087" stroke-opacity=".4" stroke-width="3"/>
      <rect x="748" y="463" width="61" height="46" rx="9" fill="#48605e" stroke="#2d4447" stroke-width="4"/>
      <path d="M758 473v26m10-26v26m10-26v26m10-26v26" stroke="#2c4447" stroke-width="4"/>
      <path d="m684 436 97 37q15 8 0 22l-105-23" fill="none" stroke="#233b3d" stroke-width="5"/>
      <circle cx="680" cy="450" r="29" fill="#314a4d" stroke="#859084" stroke-width="3"/>
      <!-- Rotating crank and counterweight; coordinates local to the shaft. -->
      <g id="crank">
        <path d="M-9-12 9-12 20 51H-20Z" fill="#b8744d" stroke="#634f40" stroke-width="3"/>
        <path d="M-49 30Q0 10 49 30L62 68Q0 97-62 68Z" fill="url(#rust)" stroke="#674e3e" stroke-width="4"/>
        <path d="M-45 40Q0 23 45 40" fill="none" stroke="#efb57b" stroke-width="3" opacity=".6"/>
        <path d="M0 8V-48" stroke="#293f43" stroke-width="20" stroke-linecap="round"/>
        <path d="M0 3V-46" stroke="#657b73" stroke-width="7" stroke-linecap="round"/>
      </g>
      <circle cx="680" cy="410" r="15" fill="#9da28b" stroke="#243d42" stroke-width="5"/>
      <circle cx="680" cy="410" r="5" fill="#34494b"/>
      <!-- Pitman endpoints are solved from the four-bar linkage. -->
      <line id="pitmanEdge" stroke="#273e41" stroke-width="15" stroke-linecap="round"/>
      <line id="pitman" stroke="#829084" stroke-width="7" stroke-linecap="round"/>
      <circle id="crankPin" r="8" fill="#c1b597" stroke="#31494b" stroke-width="4"/>
      <g id="beam">
        <path d="M-237-13H147v25H-237Z" fill="url(#steel)" stroke="#233b40" stroke-width="3"/>
        <path d="M-226-8H140" stroke="#86988a" stroke-width="3" opacity=".65"/>
        <path d="M-216 10-126-33 0-8 127-25 145 9" fill="none" stroke="#3b5559" stroke-width="7"/>
        <path d="M-231-63A240 240 0 0 0-231 63L-193 43V-44Z" fill="url(#rust)" stroke="#794f39" stroke-width="4"/>
        <path d="M-228-52A232 232 0 0 0-228 52" fill="none" stroke="#f0b579" stroke-width="3"/>
        <path d="M-218-31h16m-19 17h19m-20 17h20m-19 17h19" stroke="#854f36" stroke-width="3"/>
        <circle cx="145" r="9" fill="#beb394" stroke="#2b4448" stroke-width="4"/>
      </g>
      <circle cx="500" cy="250" r="18" fill="#344e51" stroke="#93a092" stroke-width="4"/>
      <circle cx="500" cy="250" r="7" fill="#c5b798"/>
      <!-- A circular horsehead keeps the bridle tangent at a fixed x. -->
      <line id="bridle" x1="260" y1="250" x2="260" y2="380" stroke="#4c5148" stroke-width="3"/>
      <g id="rod">
        <path d="M260 370V510" stroke="#d4ceb5" stroke-width="5"/>
        <rect x="247" y="368" width="26" height="9" rx="2" fill="#354e4e"/>
      </g>
      <!-- Wellhead and production line. -->
      <path d="M230 536h60v13h-60Z" fill="#4e5e56"/>
      <path d="M260 533v-62m-16 17h32m-37 32h42m-21-19h45v33h39" fill="none" stroke="#354f4f" stroke-width="12" stroke-linejoin="round"/>
      <path d="M242 470h36v10h-36Z" fill="#ac8c60"/>
      <circle cx="306" cy="497" r="13" fill="none" stroke="#a65e40" stroke-width="4"/>
      <path d="M294 497h24m-12-12v24" stroke="#a65e40" stroke-width="3"/>
      <g fill="#d0b58a"><circle cx="375" cy="520" r="3"/><circle cx="760" cy="520" r="3"/></g>
      <g stroke="#525f52" fill="none" stroke-width="2" opacity=".7"><path d="m137 548-4-17m4 17 9-12m-9 12-13-5m766 27 5-22m-5 22-10-13m10 13 15-7"/></g>
      <g fill="#4b5b56" font-family="monospace" font-size="10" letter-spacing="2" opacity=".7">
        <text x="42" y="607">PUMPJACK / BEAM PUMP</text>
        <text x="1058" y="607" text-anchor="end">THE RHYTHM OF THE FIELD</text>
      </g>
    </svg>
  </section>
  <div class="controls">
    <button id="toggle" type="button" aria-pressed="false">暂停动画</button>
    <label for="speed">运转速度 <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><output id="speedValue" for="speed">1.00×</output></label>
    <div class="status"><i id="statusDot"></i><span id="statusText">正在运转</span></div>
  </div>
  <footer><span>曲柄旋转 → 连杆传动 → 游梁摆动 → 抽油杆往复</span><span>纯 SVG · 离线可用</span></footer>
</main>
<script>
  (() => {
    const $ = id => document.getElementById(id);
    const crank = $('crank'), beam = $('beam'), rod = $('rod');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let running = !reducedMotion.matches, phase = 0, previous = null;
    // Intersect the rear beam's circle (r=145) with the pitman circle (r=185).
    // This preserves the length of both rigid members throughout the cycle.
    function draw(angle) {
      const px = 680 + 48 * Math.sin(angle);
      const py = 410 - 48 * Math.cos(angle);
      const dx = px - 500, dy = py - 250, distance = Math.hypot(dx, dy);
      const along = (145 ** 2 - 185 ** 2 + distance ** 2) / (2 * distance);
      const height = Math.sqrt(Math.max(0, 145 ** 2 - along ** 2));
      const bx = 500 + along * dx / distance + height * dy / distance;
      const by = 250 + along * dy / distance - height * dx / distance;
      const tilt = Math.atan2(by - 250, bx - 500);
      crank.setAttribute('transform', `translate(680 410) rotate(${angle * 180 / Math.PI})`);
      beam.setAttribute('transform', `translate(500 250) rotate(${tilt * 180 / Math.PI})`);
      for (const id of ['pitmanEdge', 'pitman']) {
        const line = $(id);
        line.setAttribute('x1', px); line.setAttribute('y1', py);
        line.setAttribute('x2', bx); line.setAttribute('y2', by);
      }
      $('crankPin').setAttribute('cx', px);
      $('crankPin').setAttribute('cy', py);
      // The bridle unwraps along the circular horsehead: travel = radius × angle.
      const travel = -240 * tilt;
      rod.setAttribute('transform', `translate(0 ${travel})`);
      $('bridle').setAttribute('y2', 370 + travel);
    }
    function updateControls() {
      $('toggle').textContent = running ? '暂停动画' : '播放动画';
      $('toggle').setAttribute('aria-pressed', String(!running));
      $('statusText').textContent = running ? '正在运转' : '已暂停';
      $('statusDot').style.background = running ? '#a4bb9e' : '#8b918d';
    }
    $('toggle').addEventListener('click', () => { running = !running; updateControls(); });
    $('speed').addEventListener('input', event => {
      $('speedValue').textContent = Number(event.target.value).toFixed(2) + '×';
    });
    document.addEventListener('visibilitychange', () => { previous = null; });
    function frame(now) {
      if (previous !== null && running && !document.hidden) {
        phase = (phase + Math.min((now - previous) / 1000, .1) * Number($('speed').value) * Math.PI / 3) % (Math.PI * 2);
        draw(phase);
      }
      previous = now;
      requestAnimationFrame(frame);
    }
    draw(phase);
    updateControls();
    requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
