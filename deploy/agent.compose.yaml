name: rainsync-agent
services:
  agent:
    image: ${RAINSYNC_IMAGE:-rainsync-server:dev}
    command: ["rainsync-nas-agent"]
    environment:
      SERVER_URL: ${SERVER_URL:?Set SERVER_URL}
      AGENT_DATA_ORIGIN: ${AGENT_DATA_ORIGIN:-${SERVER_URL}}
      PAIR_CODE: ${PAIR_CODE:-}
      AGENT_CREDENTIAL_FILE: /state/credentials.json
      MEDIA_ROOT: /media
    volumes: ["${MEDIA_PATH:?Set MEDIA_PATH}:/media:ro", "agent_state:/state"]
    restart: unless-stopped
volumes:
  agent_state:
